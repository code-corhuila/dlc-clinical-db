name: Database CI

on:
  pull_request:
    branches: [develop, qa, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Start MongoDB replica set
        run: docker compose --env-file .env.example -f deploy/compose.yml up -d mongo
      - name: Apply migrations from an empty database
        run: docker compose --env-file .env.example -f deploy/compose.yml --profile migrate run --rm liquibase
      - name: Verify migrations are incremental
        run: docker compose --env-file .env.example -f deploy/compose.yml --profile migrate run --rm liquibase update
      - name: Verify collection validators and named indexes
        run: |
          docker exec dlc-clinical-mongo-dev mongosh --quiet --eval '
            const clinical = db.getSiblingDB("clinical");
            const required = ["clinical_records", "consultations", "diagnoses", "clinical_entries", "treatments", "procedures", "procedure_extras", "care_closures", "inbox_events", "outbox_events"];
            const names = clinical.getCollectionNames();
            required.forEach(name => { if (!names.includes(name)) throw new Error(`missing collection: ${name}`); });
            const record = clinical.getCollectionInfos({name: "clinical_records"})[0];
            if (record.options.validationLevel !== "strict" || record.options.validationAction !== "error") throw new Error("clinical_records validator is not strict/error");
            if (!clinical.clinical_records.getIndexes().some(index => index.name === "uq_clinical_records_patient_id")) throw new Error("missing record uniqueness index");
            if (!clinical.outbox_events.getIndexes().some(index => index.name === "idx_outbox_events_publish_work")) throw new Error("missing outbox work index");
          '
      - name: Roll back and reapply
        run: |
          docker compose --env-file .env.example -f deploy/compose.yml --profile migrate run --rm liquibase rollback-count 3
          docker compose --env-file .env.example -f deploy/compose.yml --profile migrate run --rm liquibase update
      - name: Clean up
        if: always()
        run: docker compose --env-file .env.example -f deploy/compose.yml down -v
