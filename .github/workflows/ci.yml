name: CI

on:
  pull_request:
    branches: [develop, qa, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: |
          docker network create platform || true
          MONGO_HOST=clinical-ci-mongo docker compose -f deploy/compose.yml --profile tooling config
      - name: Verify Clinical migrations against ephemeral MongoDB
        run: bash tooling/verify-migrations.sh
