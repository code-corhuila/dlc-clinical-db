databaseChangeLog:
  - changeSet:
      id: clinical-001-create-collections
      author: dlc-clinical
      changes:
        - createCollection:
            collectionName: clinical_records
            options: '{"validator":{"$jsonSchema":{"bsonType":"object","additionalProperties":false,"required":["_id","clinicalRecordId","patientId","version","createdAt","updatedAt","createdBy"],"properties":{"_id":{"bsonType":"string"},"clinicalRecordId":{"bsonType":"string"},"patientId":{"bsonType":"string"},"version":{"bsonType":["int","long"],"minimum":1},"createdAt":{"bsonType":"date"},"updatedAt":{"bsonType":"date"},"createdBy":{"bsonType":"string"}}}},"validationLevel":"strict","validationAction":"error"}'
        - createCollection:
            collectionName: consultations
            options: '{"validator":{"$jsonSchema":{"bsonType":"object","additionalProperties":false,"required":["_id","consultationId","clinicalRecordId","dentistId","text","createdAt","updatedAt","version"],"dependencies":{"amendsEntryId":["amendmentReason"],"amendmentReason":["amendsEntryId"]},"properties":{"_id":{"bsonType":"string"},"consultationId":{"bsonType":"string"},"clinicalRecordId":{"bsonType":"string"},"dentistId":{"bsonType":"string"},"appointmentId":{"bsonType":"string"},"text":{"bsonType":"string","minLength":1,"maxLength":10000},"amendsEntryId":{"bsonType":"string"},"amendmentReason":{"bsonType":"string","minLength":1,"maxLength":1000},"createdAt":{"bsonType":"date"},"updatedAt":{"bsonType":"date"},"version":{"bsonType":["int","long"],"minimum":1}}}},"validationLevel":"strict","validationAction":"error"}'
        - createCollection:
            collectionName: diagnoses
            options: '{"validator":{"$jsonSchema":{"bsonType":"object","additionalProperties":false,"required":["_id","diagnosisId","clinicalRecordId","dentistId","text","createdAt","updatedAt","version"],"dependencies":{"amendsEntryId":["amendmentReason"],"amendmentReason":["amendsEntryId"]},"properties":{"_id":{"bsonType":"string"},"diagnosisId":{"bsonType":"string"},"clinicalRecordId":{"bsonType":"string"},"dentistId":{"bsonType":"string"},"code":{"bsonType":"string","minLength":1,"maxLength":80},"text":{"bsonType":"string","minLength":1,"maxLength":10000},"amendsEntryId":{"bsonType":"string"},"amendmentReason":{"bsonType":"string","minLength":1,"maxLength":1000},"createdAt":{"bsonType":"date"},"updatedAt":{"bsonType":"date"},"version":{"bsonType":["int","long"],"minimum":1}}}},"validationLevel":"strict","validationAction":"error"}'
        - createCollection:
            collectionName: clinical_entries
            options: '{"validator":{"$jsonSchema":{"bsonType":"object","additionalProperties":false,"required":["_id","entryId","clinicalRecordId","kind","text","authorId","createdAt","updatedAt","version"],"dependencies":{"amendsEntryId":["amendmentReason"],"amendmentReason":["amendsEntryId"]},"properties":{"_id":{"bsonType":"string"},"entryId":{"bsonType":"string"},"clinicalRecordId":{"bsonType":"string"},"kind":{"enum":["EVOLUTION","ANTECEDENT","ALLERGY"]},"text":{"bsonType":"string","minLength":1,"maxLength":10000},"code":{"bsonType":"string","minLength":1,"maxLength":80},"appointmentId":{"bsonType":"string"},"authorId":{"bsonType":"string"},"amendsEntryId":{"bsonType":"string"},"amendmentReason":{"bsonType":"string","minLength":1,"maxLength":1000},"createdAt":{"bsonType":"date"},"updatedAt":{"bsonType":"date"},"version":{"bsonType":["int","long"],"minimum":1}}}},"validationLevel":"strict","validationAction":"error"}'
        - createCollection:
            collectionName: treatments
            options: '{"validator":{"$jsonSchema":{"bsonType":"object","additionalProperties":false,"required":["_id","treatmentId","clinicalRecordId","patientId","status","procedures","createdAt","updatedAt","version"],"properties":{"_id":{"bsonType":"string"},"treatmentId":{"bsonType":"string"},"clinicalRecordId":{"bsonType":"string"},"patientId":{"bsonType":"string"},"diagnosisId":{"bsonType":"string"},"clinicalReason":{"bsonType":"string","minLength":1,"maxLength":1000},"status":{"enum":["PLANNED","IN_PROGRESS","COMPLETED","CANCELLED"]},"procedures":{"bsonType":"array","minItems":1,"maxItems":100,"items":{"bsonType":"object","additionalProperties":false,"required":["procedureId","procedureCode","appointmentId","status"],"properties":{"procedureId":{"bsonType":"string"},"procedureCode":{"bsonType":"string","minLength":1,"maxLength":80},"appointmentId":{"bsonType":"string"},"status":{"enum":["PLANNED","IN_PROGRESS","COMPLETED","CANCELLED"]}}}},"createdAt":{"bsonType":"date"},"updatedAt":{"bsonType":"date"},"version":{"bsonType":["int","long"],"minimum":1}}}},"validationLevel":"strict","validationAction":"error"}'
        - createCollection:
            collectionName: procedures
            options: '{"validator":{"$jsonSchema":{"bsonType":"object","additionalProperties":false,"required":["_id","procedureId","treatmentId","clinicalRecordId","patientId","appointmentId","procedureCode","status","createdAt","updatedAt","version"],"properties":{"_id":{"bsonType":"string"},"procedureId":{"bsonType":"string"},"treatmentId":{"bsonType":"string"},"clinicalRecordId":{"bsonType":"string"},"patientId":{"bsonType":"string"},"appointmentId":{"bsonType":"string"},"procedureCode":{"bsonType":"string","minLength":1,"maxLength":80},"status":{"enum":["PLANNED","IN_PROGRESS","COMPLETED","CANCELLED"]},"completionIdempotencyKey":{"bsonType":"string","minLength":1,"maxLength":200},"completedBy":{"bsonType":"string"},"completedAt":{"bsonType":"date"},"createdAt":{"bsonType":"date"},"updatedAt":{"bsonType":"date"},"version":{"bsonType":["int","long"],"minimum":1}}}},"validationLevel":"strict","validationAction":"error"}'
        - createCollection:
            collectionName: procedure_extras
            options: '{"validator":{"$jsonSchema":{"bsonType":"object","additionalProperties":false,"required":["_id","sourceRecordId","procedureId","appointmentId","type","quantity","description","clinicalReason","authorId","createdAt"],"properties":{"_id":{"bsonType":"string"},"sourceRecordId":{"bsonType":"string"},"procedureId":{"bsonType":"string"},"appointmentId":{"bsonType":"string"},"type":{"enum":["MATERIAL","ADDITIONAL_PROCEDURE","COMPLEXITY_ADJUSTMENT","OTHER_AUTHORIZED_CHARGE"]},"code":{"bsonType":"string","minLength":1,"maxLength":80},"quantity":{"bsonType":["int","long","decimal"],"minimum":0,"exclusiveMinimum":true},"description":{"bsonType":"string","minLength":1,"maxLength":1000},"clinicalReason":{"bsonType":"string","minLength":1,"maxLength":1000},"authorId":{"bsonType":"string"},"createdAt":{"bsonType":"date"}}}},"validationLevel":"strict","validationAction":"error"}'
        - createCollection:
            collectionName: care_closures
            options: '{"validator":{"$jsonSchema":{"bsonType":"object","additionalProperties":false,"required":["_id","closureId","procedureId","appointmentId","status","appointmentOutcome","billingOutcome","correlationId","causationId","createdAt","updatedAt","version"],"properties":{"_id":{"bsonType":"string"},"closureId":{"bsonType":"string"},"procedureId":{"bsonType":"string"},"appointmentId":{"bsonType":"string"},"status":{"enum":["CLOSURE_PENDING","CLOSURE_COMPLETED","CLOSURE_FAILED"]},"appointmentOutcome":{"enum":["PENDING","COMPLETED"]},"billingOutcome":{"enum":["PENDING","COMPLETED"]},"failureReason":{"bsonType":"string","minLength":1,"maxLength":500},"correlationId":{"bsonType":"string"},"causationId":{"bsonType":"string"},"createdAt":{"bsonType":"date"},"updatedAt":{"bsonType":"date"},"version":{"bsonType":["int","long"],"minimum":1}}}},"validationLevel":"strict","validationAction":"error"}'
        - createCollection:
            collectionName: inbox_events
            options: '{"validator":{"$jsonSchema":{"bsonType":"object","additionalProperties":false,"required":["_id","eventId","eventType","eventVersion","aggregateId","correlationId","causationId","payload","receivedAt","status","attempts"],"properties":{"_id":{"bsonType":"string"},"eventId":{"bsonType":"string"},"eventType":{"bsonType":"string","minLength":1,"maxLength":200},"eventVersion":{"bsonType":"string","minLength":1,"maxLength":40},"aggregateId":{"bsonType":"string"},"correlationId":{"bsonType":"string"},"causationId":{"bsonType":"string"},"payload":{"bsonType":"object"},"receivedAt":{"bsonType":"date"},"processedAt":{"bsonType":"date"},"status":{"enum":["RECEIVED","PROCESSED","FAILED"]},"attempts":{"bsonType":["int","long"],"minimum":0},"failureReason":{"bsonType":"string","maxLength":500}}}},"validationLevel":"strict","validationAction":"error"}'
        - createCollection:
            collectionName: outbox_events
            options: '{"validator":{"$jsonSchema":{"bsonType":"object","additionalProperties":false,"required":["_id","eventId","eventType","eventVersion","aggregateId","correlationId","causationId","payload","occurredAt","status","attempts","createdAt"],"properties":{"_id":{"bsonType":"string"},"eventId":{"bsonType":"string"},"eventType":{"bsonType":"string","minLength":1,"maxLength":200},"eventVersion":{"bsonType":"string","minLength":1,"maxLength":40},"aggregateId":{"bsonType":"string"},"correlationId":{"bsonType":"string"},"causationId":{"bsonType":"string"},"payload":{"bsonType":"object"},"occurredAt":{"bsonType":"date"},"publishedAt":{"bsonType":"date"},"status":{"enum":["PENDING","PUBLISHED","FAILED"]},"attempts":{"bsonType":["int","long"],"minimum":0},"nextAttemptAt":{"bsonType":"date"},"failureReason":{"bsonType":"string","maxLength":500},"createdAt":{"bsonType":"date"}}}},"validationLevel":"strict","validationAction":"error"}'
      rollback:
        - dropCollection: { collectionName: outbox_events }
        - dropCollection: { collectionName: inbox_events }
        - dropCollection: { collectionName: care_closures }
        - dropCollection: { collectionName: procedure_extras }
        - dropCollection: { collectionName: procedures }
        - dropCollection: { collectionName: treatments }
        - dropCollection: { collectionName: clinical_entries }
        - dropCollection: { collectionName: diagnoses }
        - dropCollection: { collectionName: consultations }
        - dropCollection: { collectionName: clinical_records }
