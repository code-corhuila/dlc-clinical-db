databaseChangeLog:
  - changeSet:
      id: clinical-003-create-service-roles
      author: dlc-clinical
      changes:
        - runCommand:
            command: '{"createRole":"clinical_application","privileges":[{"resource":{"db":"clinical","collection":"clinical_records"},"actions":["find","insert","update"]},{"resource":{"db":"clinical","collection":"consultations"},"actions":["find","insert","update"]},{"resource":{"db":"clinical","collection":"diagnoses"},"actions":["find","insert","update"]},{"resource":{"db":"clinical","collection":"clinical_entries"},"actions":["find","insert","update"]},{"resource":{"db":"clinical","collection":"treatments"},"actions":["find","insert","update"]},{"resource":{"db":"clinical","collection":"procedures"},"actions":["find","insert","update"]},{"resource":{"db":"clinical","collection":"procedure_extras"},"actions":["find","insert","update"]},{"resource":{"db":"clinical","collection":"care_closures"},"actions":["find","insert","update"]},{"resource":{"db":"clinical","collection":"outbox_events"},"actions":["insert"]}],"roles":[]}'
        - runCommand:
            command: '{"createRole":"clinical_inbox_consumer","privileges":[{"resource":{"db":"clinical","collection":"inbox_events"},"actions":["find","insert","update"]}],"roles":[]}'
        - runCommand:
            command: '{"createRole":"clinical_outbox_publisher","privileges":[{"resource":{"db":"clinical","collection":"outbox_events"},"actions":["find","update"]}],"roles":[]}'
      rollback:
        - runCommand:
            command: '{"dropRole":"clinical_outbox_publisher"}'
        - runCommand:
            command: '{"dropRole":"clinical_inbox_consumer"}'
        - runCommand:
            command: '{"dropRole":"clinical_application"}'
  - changeSet:
      id: clinical-007-grant-idempotency-keys
      author: dlc-clinical
      comment: The service reads and inserts retry records; expiry is handled by the TTL index, so no remove/update.
      changes:
        - runCommand:
            command: '{"grantPrivilegesToRole":"clinical_application","privileges":[{"resource":{"db":"clinical","collection":"idempotency_keys"},"actions":["find","insert"]}]}'
      rollback:
        - runCommand:
            command: '{"revokePrivilegesFromRole":"clinical_application","privileges":[{"resource":{"db":"clinical","collection":"idempotency_keys"},"actions":["find","insert"]}]}'
  - changeSet:
      id: clinical-018-grant-write-intents-and-admissions
      author: dlc-clinical
      comment: The service and its reconciler read, insert and update intents and admissions; nothing is removed, and no DDL privilege is granted.
      changes:
        - runCommand:
            command: '{"grantPrivilegesToRole":"clinical_application","privileges":[{"resource":{"db":"clinical","collection":"write_intents"},"actions":["find","insert","update"]},{"resource":{"db":"clinical","collection":"encounter_admissions"},"actions":["find","insert","update"]}]}'
      rollback:
        - runCommand:
            command: '{"revokePrivilegesFromRole":"clinical_application","privileges":[{"resource":{"db":"clinical","collection":"write_intents"},"actions":["find","insert","update"]},{"resource":{"db":"clinical","collection":"encounter_admissions"},"actions":["find","insert","update"]}]}'
  - changeSet:
      id: clinical-023-analytics-roles
      author: dlc-clinical
      comment: The analytics consumer writes projections; the API only reads them. Rebuilding (drop and replay) is a migration-identity operation.
      changes:
        - runCommand:
            command: '{"createRole":"clinical_analytics_projector","privileges":[{"resource":{"db":"clinical","collection":"analytics_appointment_facts"},"actions":["find","insert","update"]},{"resource":{"db":"clinical","collection":"analytics_weekly_activity"},"actions":["find","insert","update"]},{"resource":{"db":"clinical","collection":"analytics_monthly_revenue"},"actions":["find","insert","update"]},{"resource":{"db":"clinical","collection":"analytics_processed_events"},"actions":["find","insert","update"]}],"roles":[]}'
        - runCommand:
            command: '{"grantPrivilegesToRole":"clinical_application","privileges":[{"resource":{"db":"clinical","collection":"analytics_appointment_facts"},"actions":["find"]},{"resource":{"db":"clinical","collection":"analytics_weekly_activity"},"actions":["find"]},{"resource":{"db":"clinical","collection":"analytics_monthly_revenue"},"actions":["find"]},{"resource":{"db":"clinical","collection":"analytics_processed_events"},"actions":["find"]}]}'
      rollback:
        - runCommand:
            command: '{"revokePrivilegesFromRole":"clinical_application","privileges":[{"resource":{"db":"clinical","collection":"analytics_appointment_facts"},"actions":["find"]},{"resource":{"db":"clinical","collection":"analytics_weekly_activity"},"actions":["find"]},{"resource":{"db":"clinical","collection":"analytics_monthly_revenue"},"actions":["find"]},{"resource":{"db":"clinical","collection":"analytics_processed_events"},"actions":["find"]}]}'
        - runCommand:
            command: '{"dropRole":"clinical_analytics_projector"}'
